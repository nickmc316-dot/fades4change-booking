<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fades 4 Change Staff</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
.tabs{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px;align-self:flex-start;flex-wrap:wrap}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:7px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font:600 11px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 8px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.ok-msg{color:var(--ok);font-size:14px;min-height:1em}
.wkcard{margin-top:10px;gap:4px}
.wkcard.open{border-top:5px solid var(--steel)}
.wkcard.closed{border-top:5px solid var(--accent)}
.wkhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;padding-bottom:8px}
.wkhead h2{font-size:28px}
.wkhead + .stmt{border-top:0}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="pole" aria-hidden="true"></div>
      <div><h1>Fades 4 Change</h1><small id="who">Staff</small></div></div>
    <button class="btn ghost" id="signout" hidden>Sign out</button>
  </header>
  <main id="view"><section class="panel"><div class="empty">Loading…</div></section></main>
  <footer class="foot"><a href="index.html">Client booking page</a></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function () {
  const C = window.F4C_CONFIG, T = window.F4C_TIME;
  const sb = supabase.createClient(C.supabaseUrl, C.supabaseKey);
  const view = document.getElementById('view');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = c => (c < 0 ? '−' : '') + '$' + (Math.abs(c) / 100).toFixed(Math.abs(c) % 100 ? 2 : 0);
  const CARRIERS = { verizon: 'Verizon', tmobile: 'T-Mobile', att: 'AT&T', uscellular: 'US Cellular', cricket: 'Cricket', metro: 'Metro by T-Mobile', boost: 'Boost', googlefi: 'Google Fi', other: 'Other' };
  // Carriers whose email-to-text addresses still deliver; everyone else gets app notifications.
  const EMAIL_TEXT_OK = ['verizon', 'tmobile', 'uscellular', 'googlefi'];

  let shop, me, tab = 'schedule', day, authMode = 'signin', msg = '', err = '', openDetail = null;
  let services = [], adding = false, addErr = '';
  const ADD_ERRORS = {
    slot_taken: 'That barber already has someone at that time. Check the time, or cancel the other appointment first.',
    name_required: 'Add the client’s name.',
    not_allowed: 'You can only add appointments to your own chair.',
  };

  // ── Auth ──────────────────────────────────────────────────────────────
  function renderAuth() {
    document.getElementById('signout').hidden = true;
    document.getElementById('who').textContent = 'Staff login';
    view.innerHTML = `<section class="panel">
      <div class="tabs" role="group" aria-label="Login or create account">
        <button data-auth="signin" aria-pressed="${authMode === 'signin'}">Log in</button>
        <button data-auth="signup" aria-pressed="${authMode === 'signup'}">Create account</button>
      </div>
      <div><h2>${authMode === 'signin' ? 'Barber login' : 'Set up your login'}</h2>
        <p class="hint" style="margin:4px 0 0">${authMode === 'signin' ? 'Use the email Danny has on file for you.' : 'Use the email Danny added for you. We’ll send a link to confirm it.'}</p></div>
      <form id="authform" class="list" novalidate>
        <div class="field"><label for="a-email">Email</label><input id="a-email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="a-pass">Password</label><input id="a-pass" type="password" autocomplete="${authMode === 'signin' ? 'current-password' : 'new-password'}" minlength="8" required>
          ${authMode === 'signup' ? '<span class="hint">At least 8 characters.</span>' : ''}</div>
        <div class="error" role="alert">${esc(err)}</div><div class="ok-msg" role="status">${esc(msg)}</div>
        <button class="btn primary" type="submit">${authMode === 'signin' ? 'Log in' : 'Create account'}</button>
      </form>
      ${authMode === 'signin' ? '<button class="linkbtn" data-forgot>Forgot your password?</button>' : ''}
    </section>`;
  }

  view.addEventListener('submit', async e => {
    if (e.target.id === 'authform') {
      e.preventDefault();
      const email = document.getElementById('a-email').value.trim(), password = document.getElementById('a-pass').value;
      err = ''; msg = '';
      if (!/^\S+@\S+\.\S+$/.test(email)) { err = 'Enter your email.'; return renderAuth(); }
      if (password.length < 8) { err = 'Passwords are at least 8 characters.'; return renderAuth(); }
      const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
      if (authMode === 'signin') {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) { err = /confirm/i.test(error.message) ? 'Confirm your email first: open the link we sent you.' : 'That email and password don’t match.'; renderAuth(); }
      } else {
        const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.href.split('#')[0] } });
        if (error) { err = error.message; renderAuth(); }
        else if (!data.session) { msg = 'Check your email and open the link to confirm, then log in here.'; authMode = 'signin'; renderAuth(); }
      }
    }
    if (e.target.id === 'profileform') { e.preventDefault(); await saveProfile(); }
    if (e.target.id === 'payform') {
      e.preventDefault();
      const v = id => document.getElementById(id).value;
      payErr = ''; payMsg = '';
      const wantOn = document.getElementById('pay-on').checked;
      const { data: on, error } = await sb.rpc('set_payment_settings', {
        p_shop: C.shopId, p_environment: v('pay-env'), p_merchant_id: v('pay-mid'), p_private_token: v('pay-token'),
        p_webhook_secret: v('pay-secret'), p_enabled: wantOn,
      });
      if (error) payErr = 'Couldn’t save. Try again.';
      else if (wantOn && !on) payErr = 'Saved, but online deposits stay off until the merchant ID, private token and webhook secret are all filled in.';
      else payMsg = on ? 'Saved. Online deposits are on.' : 'Saved. Online deposits are off.';
      render();
    }
    if (e.target.id === 'addform') {
      e.preventDefault();
      const v = id => document.getElementById(id) ? document.getElementById(id).value : '';
      const d = v('ad-day'), t = v('ad-time');
      addErr = '';
      if (!v('ad-name').trim()) addErr = ADD_ERRORS.name_required;
      else if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || !/^\d{2}:\d{2}/.test(t)) addErr = 'Pick a day and time.';
      if (addErr) return render();
      const [hh, mm] = t.split(':').map(Number);
      const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Adding…';
      const { error } = await sb.rpc('staff_add_booking', {
        p_barber: owner() ? v('ad-barber') : me.id, p_service: v('ad-service'),
        p_starts_at: T.toUtc(d, hh * 60 + mm, shop.timezone).toISOString(),
        p_client_name: v('ad-name'), p_source: v('ad-source'), p_client_phone: v('ad-phone'), p_cut_notes: v('ad-notes'),
      });
      if (error) {
        const code = Object.keys(ADD_ERRORS).find(k => (error.message || '').includes(k));
        addErr = code ? ADD_ERRORS[code] : 'Couldn’t add that appointment. Try again.';
      } else { adding = false; day = d; msg = ''; }
      render();
    }
  });

  // ── Session start ─────────────────────────────────────────────────────
  let starting = false;
  async function start() {
    if (starting) return; starting = true;
    try { await startInner(); } finally { starting = false; }
  }
  async function startInner() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return renderAuth();
    const { data: barberId, error } = await sb.rpc('claim_barber_profile');
    if (error || !barberId) {
      document.getElementById('signout').hidden = false;
      view.innerHTML = `<section class="panel"><h2>You're logged in, but not on the team list yet</h2>
        <p class="hint" style="margin:0">Ask Danny to add <b>${esc(session.user.email)}</b> as your email in the app, then log in again.</p></section>`;
      return;
    }
    const [b, s] = await Promise.all([
      sb.from('barbers').select('*').eq('id', barberId).single(),
      sb.from('shops').select('*').eq('id', C.shopId).single(),
    ]);
    me = b.data; shop = s.data;
    services = (await sb.from('services').select('*').eq('shop_id', C.shopId).eq('active', true).order('sort')).data || [];
    day = T.todayIn(shop.timezone);
    document.getElementById('signout').hidden = false;
    document.getElementById('who').textContent = me.name + (me.role === 'owner' ? ' · Owner' : '');
    render();
  }

  // ── Views ─────────────────────────────────────────────────────────────
  const owner = () => me.role === 'owner';
  function tabs() {
    const t = [['schedule', 'Schedule'], ['earnings', 'Earnings'], ['rent', 'Booth rent'], ['profile', 'My profile']];
    if (owner()) t.push(['team', 'Team']);
    return `<div class="tabs" role="group" aria-label="Sections">${t.map(([k, l]) => `<button data-tab="${k}" aria-pressed="${tab === k}">${l}</button>`).join('')}</div>`;
  }
  async function render() {
    err = err || '';
    const body = await ({ schedule: schedule, earnings: earnings, rent: rent, profile: profile, team: team }[tab])();
    view.innerHTML = tabs() + body;
  }

  const timeIn = iso => new Date(iso).toLocaleTimeString('en-US', { timeZone: shop.timezone, hour: 'numeric', minute: '2-digit' }).replace(' ', '').toLowerCase();

  async function schedule() {
    const from = T.toUtc(day, 0, shop.timezone).toISOString(), to = T.toUtc(T.addDays(day, 1), 0, shop.timezone).toISOString();
    const [{ data: list, error }, { data: team }] = await Promise.all([
      sb.from('bookings').select('*, services(name, minutes, price_cents)').gte('starts_at', from).lt('starts_at', to).order('starts_at'),
      owner() ? sb.from('barbers').select('id, name') : Promise.resolve({ data: [me] }),
    ]);
    if (error) return '<section class="panel"><div class="error">Couldn’t load the schedule. Refresh to try again.</div></section>';
    const names = Object.fromEntries((team || []).map(x => [x.id, x.name]));
    const today = T.todayIn(shop.timezone);
    let days = '';
    for (let i = -1; i < 13; i++) {
      const d = T.addDays(today, i);
      days += `<button class="day" data-day="${d}" aria-pressed="${d === day}"><small>${i === 0 ? 'Today' : T.label(d, { weekday: 'short' })}</small><strong>${+d.slice(8)}</strong></button>`;
    }
    const live = list.filter(a => a.status !== 'cancelled' && a.status !== 'noshow');
    const booked = live.reduce((t, a) => t + a.services.price_cents, 0);
    const srcChip = a => a.source === 'booksy' ? '<span class="chip info">From Booksy</span>' : a.source === 'walkin' ? '<span class="chip info">Walk-in</span>' : '';
    const chip = a => srcChip(a) + ({
      pending: '<span class="chip warn">Waiting on online payment</span>',
      confirmed: a.source !== 'app' ? '' : (a.deposit_paid ? '<span class="chip ok">Deposit paid</span>' : '<span class="chip warn">Deposit not paid yet</span>'),
      done: '<span class="chip ok">Done</span>', noshow: '<span class="chip bad">No-show</span>', cancelled: '<span class="chip info">Cancelled</span>',
    }[a.status]);
    const chairs = owner() ? (team || []) : [me];
    const addForm = !adding ? `<button class="btn primary" data-addopen style="flex:none">+ Add appointment</button>` : `<section class="panel">
      <div><div class="label">Booksy, walk-in or phone booking</div><h2>Add an appointment</h2>
        <p class="hint" style="margin:4px 0 0">Blocks this time on the online booking page right away.</p></div>
      <form id="addform" class="list" novalidate>
        <div class="field"><label for="ad-source">Where it was booked</label><select id="ad-source"><option value="booksy">Booksy</option><option value="walkin">Walk-in / phone</option></select></div>
        ${owner() ? `<div class="field"><label for="ad-barber">Barber</label><select id="ad-barber">${chairs.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>` : ''}
        <div class="field"><label for="ad-service">Service</label><select id="ad-service">${services.map(x => `<option value="${x.id}">${esc(x.name)} · ${x.minutes} min</option>`).join('')}</select></div>
        <div class="row"><div class="field" style="flex:1;min-width:140px"><label for="ad-day">Day</label><input id="ad-day" type="date" value="${day}"></div>
          <div class="field" style="flex:1;min-width:120px"><label for="ad-time">Time</label><input id="ad-time" type="time" step="300" value="10:00"></div></div>
        <div class="field"><label for="ad-name">Client name</label><input id="ad-name" maxlength="80" autocomplete="off"></div>
        <div class="field"><label for="ad-phone">Client phone (optional)</label><input id="ad-phone" type="tel" autocomplete="off"></div>
        <div class="field"><label for="ad-notes">Cut notes (optional)</label><input id="ad-notes" maxlength="500" autocomplete="off"></div>
        <div class="error" role="alert">${esc(addErr)}</div>
        <div class="row"><button class="btn ghost" type="button" data-addclose>Cancel</button><button class="btn primary" type="submit">Add to schedule</button></div>
      </form></section>`;
    return addForm + `<section class="panel">
      <div><div class="label">${owner() ? 'Whole shop' : 'Your chair'}</div><h2>${day === today ? 'Today' : T.label(day, { weekday: 'long', month: 'short', day: 'numeric' })}</h2></div>
      <div class="days">${days}</div>
      <div class="stats">
        <div class="stat"><div class="n">${live.length}</div><div class="k">appointments</div></div>
        <div class="stat"><div class="n">${money(booked)}</div><div class="k">booked</div></div>
        <div class="stat"><div class="n">${list.filter(a => a.deposit_paid).length}</div><div class="k">deposits paid</div></div>
      </div>
      <div>${list.length ? list.map(a => `<div class="appt">
        <div class="time">${timeIn(a.starts_at)}</div>
        <div><div class="who"><b>${esc(a.client_name)}</b><span class="price">${money(a.services.price_cents)}</span></div>
          <div class="hint">${esc(a.services.name)} · ${a.services.minutes} min${owner() ? ' · with ' + esc(names[a.barber_id] || '') : ''}</div>
          <div class="hint">${esc(a.client_phone)}${a.client_email ? ' · ' + esc(a.client_email) : ''}</div>
          ${a.cut_notes ? `<div class="notes"><span>CUT NOTES</span> ${esc(a.cut_notes)}</div>` : ''}
          <div class="chips">${chip(a)}</div>
          <div class="mini">
            ${a.status === 'confirmed' ? `<button data-status="done" data-id="${a.id}">Mark done</button><button data-status="noshow" data-id="${a.id}">No-show</button><button data-status="cancelled" data-id="${a.id}">Cancel</button>` : ''}
            ${a.status !== 'confirmed' && a.status !== 'cancelled' ? `<button data-status="confirmed" data-id="${a.id}">Undo</button>` : ''}
            ${owner() && a.status !== 'cancelled' ? `<button data-deposit="${a.deposit_paid ? 'no' : 'yes'}" data-id="${a.id}">${a.deposit_paid ? 'Undo deposit' : 'Deposit received'}</button>` : ''}
          </div>
        </div></div>`).join('') : '<div class="empty">Nothing booked this day.</div>'}</div>
      ${err ? `<div class="error" role="alert">${esc(err)}</div>` : ''}
    </section>`;
  }

  async function rent() {
    const today = T.todayIn(shop.timezone), thisWeek = T.weekStart(today), lastWeek = T.addDays(thisWeek, -7);
    const [a, b] = await Promise.all([lastWeek, thisWeek].map(w => sb.rpc('rent_statement', { p_shop: C.shopId, p_week_start: w })));
    if (a.error || b.error) return '<section class="panel"><div class="error">Couldn’t load statements. Refresh to try again.</div></section>';
    const block = (w, rows) => {
      const isLast = w === lastWeek;
      return `<section class="panel wkcard ${isLast ? 'closed' : 'open'}">
        <div class="wkhead"><div><h2>${isLast ? 'Last week' : 'This week'}</h2>
          <div class="hint">${T.label(w, { weekday: 'short', month: 'short', day: 'numeric' })} – ${T.label(T.addDays(w, 6), { weekday: 'short', month: 'short', day: 'numeric' })}</div></div>
          <span class="chip ${isLast ? 'warn' : 'info'}">${isLast ? 'Closed · settle up' : 'Still open'}</span></div>` +
        (rows.length ? rows.map(r => {
          const first = r.barber_name.split(' ')[0], bal = r.balance_cents, k = w + '|' + r.barber_id;
          let line = bal > 0 ? `Shop owes ${first} ${money(bal)}` : bal < 0 ? `${first} owes ${money(-bal)} rent` : 'Even, nothing owed';
          if (!r.week_closed) line = bal > 0 ? `So far: shop owes ${first} ${money(bal)}` : bal < 0 ? `So far: ${money(-bal)} rent left` : 'So far: even';
          let st;
          if (!r.week_closed) st = '<span class="chip info">In progress · closes Sunday night</span>';
          else if (bal === 0) st = '<span class="chip ok">Settled</span>';
          else if (!r.owner_marked_at) st = owner() ? `<span class="mini" style="margin:0"><button data-settle="${r.barber_id}" data-week="${w}">${bal > 0 ? 'Mark paid back' : 'Mark rent received'}</button></span>` : '<span class="chip warn">Waiting on Danny</span>';
          else if (!r.barber_confirmed_at) st = `<span class="chip info">Danny marked ${bal > 0 ? 'paid' : 'received'}</span>` + (owner() ? `<span class="chip warn">Waiting on ${esc(first)}</span>` : `<span class="mini" style="margin:0"><button data-ack="${w}">${bal > 0 ? 'I got it' : 'Confirm'}</button></span>`);
          else st = `<span class="chip ok">Settled · ${esc(first)} confirmed</span>`;
          return `<div class="stmt"><div class="who"><b>${esc(r.barber_name)}</b><span class="price">${r.bookings} paid deposits</span></div>
            <div class="bal ${bal > 0 ? 'pos' : bal < 0 ? 'neg' : ''}">${line}</div>
            <div class="hint">${money(r.deposits_cents)} in deposits − ${money(r.rent_cents)} rent = ${money(bal)}</div>
            <div class="chips">${st}</div></div>`;
        }).join('') : '<div class="empty">No renting barbers yet.</div>') + '</section>';
    };
    return `<section class="panel">
      <div><div class="label">Booth rent</div><h2>Weekly statements</h2><p class="hint" style="margin:4px 0 0">Each paid ${money(shop.deposit_cents)} deposit counts toward the booked barber’s rent. Weeks run Monday to Sunday. Danny and each barber see the same numbers, and both sign off when money changes hands.</p></div>
      ${owner() ? `<div class="field"><label for="rent-amt">Weekly booth rent ($)</label><div class="row"><input id="rent-amt" type="number" min="0" step="5" value="${shop.weekly_rent_cents / 100}" style="max-width:140px"><button class="btn ghost" data-saverent>Save</button></div></div>` : `<div class="hint">Weekly booth rent: ${money(shop.weekly_rent_cents)}</div>`}
      ${err ? `<div class="error" role="alert">${esc(err)}</div>` : ''}${msg ? `<div class="ok-msg">${esc(msg)}</div>` : ''}
    </section>
    ${block(thisWeek, b.data)}${block(lastWeek, a.data)}`;
  }

  async function profile() {
    const { data } = await sb.from('barbers').select('*').eq('id', me.id).single();
    me = data || me;
    const method = me.notify_method === 'email_sms' ? 'Text message (sent by email to your carrier)' : 'App notification';
    return `<section class="panel">
      <div><div class="label">My profile</div><h2>${esc(me.name)}</h2></div>
      <form id="profileform" class="list" novalidate>
        <div class="field"><label for="p-phone">Mobile number</label><input id="p-phone" type="tel" autocomplete="tel" value="${esc(me.phone)}" placeholder="(864) 555-1234"></div>
        <div class="field"><label for="p-carrier">Phone carrier</label><select id="p-carrier"><option value="">Choose your carrier</option>
          ${Object.entries(CARRIERS).map(([k, v]) => `<option value="${k}" ${me.carrier === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
          <span class="hint">Used to text you 15 minutes before each client.</span></div>
        <div class="field"><label for="p-spec">What you're known for (shows on the booking page)</label><input id="p-spec" maxlength="80" value="${esc(me.specialty)}" placeholder="e.g. Fades, designs, beards"></div>
        <div class="box"><span><b>Heads-up alerts</b><br><span class="hint">${me.carrier ? method : 'Pick your carrier to set this up.'}</span></span></div>
        <div class="error" role="alert">${esc(err)}</div><div class="ok-msg" role="status">${esc(msg)}</div>
        <button class="btn primary" type="submit">Save profile</button>
      </form>
      ${me.notify_method === 'email_sms' && me.phone ? `<div class="row"><button class="btn ghost" data-testtext>Send me a test text</button></div>` : ''}
    </section>
    <section class="panel">
      <div><div class="label">Calendar</div><h2>Sync to my calendar</h2>
        <p class="hint" style="margin:4px 0 0">Your bookings show up in Google Calendar or your iPhone calendar on their own. Set it up once.</p></div>
      <div class="field"><label for="cal-link">Your private calendar link</label>
        <div class="row" style="flex-wrap:nowrap"><input id="cal-link" readonly value="${esc(calUrl())}" style="flex:1;min-width:0"><button class="btn ghost" data-copycal>Copy</button></div>
        <span class="hint">Keep it private. Anyone with this link can see your schedule.</span></div>
      <div><div class="label">iPhone</div><p class="hint" style="margin:4px 0 0">Tap <a href="${esc(calUrl().replace(/^https:/, 'webcal:'))}">Add to iPhone calendar</a>, then Subscribe.</p></div>
      <div><div class="label">Google Calendar</div><p class="hint" style="margin:4px 0 0">On a computer, open Google Calendar. Next to “Other calendars” click + then “From URL”, paste your link, and click “Add calendar”. It shows on your phone too.</p></div>
      <p class="hint" style="margin:0">Google checks for new bookings every few hours, so a last-minute booking can show up late. Your heads-up text still comes 15 minutes before.</p>
    </section>`;
  }
  const calUrl = () => `${C.supabaseUrl}/functions/v1/calendar?token=${me.calendar_token}`;

  // ── Earnings ──────────────────────────────────────────────────────────
  let earnWeek = null;
  const SRC = { app: 'Online', booksy: 'Booksy', walkin: 'Walk-in' };
  const STATUS = { confirmed: 'Booked', done: 'Done', noshow: 'No-show', cancelled: 'Cancelled' };
  async function fetchBookings(fromDay, toDay) {
    const { data, error } = await sb.from('bookings')
      .select('starts_at, barber_id, client_name, status, source, deposit_cents, deposit_paid, services(name, price_cents)')
      .gte('starts_at', T.toUtc(fromDay, 0, shop.timezone).toISOString())
      .lt('starts_at', T.toUtc(toDay, 0, shop.timezone).toISOString())
      .order('starts_at');
    if (error) throw error;
    return data;
  }
  async function teamNames() {
    if (!owner()) return { [me.id]: me.name };
    const { data } = await sb.from('barbers').select('id, name');
    return Object.fromEntries((data || []).map(x => [x.id, x.name]));
  }
  async function earnings() {
    const today = T.todayIn(shop.timezone);
    earnWeek = earnWeek || T.weekStart(today);
    const end = T.addDays(earnWeek, 7);
    let rows, names, rent;
    try {
      [rows, names, rent] = await Promise.all([fetchBookings(earnWeek, end), teamNames(),
        sb.rpc('rent_statement', { p_shop: C.shopId, p_week_start: earnWeek }).then(r => r.data || [])]);
    } catch (_) { return '<section class="panel"><div class="error">Couldn’t load earnings. Refresh to try again.</div></section>'; }
    const per = {};
    for (const id of Object.keys(names)) per[id] = { done: 0, services: 0, noshow: 0, upcoming: 0, deposits: 0 };
    for (const r of rows) {
      const p = per[r.barber_id] || (per[r.barber_id] = { done: 0, services: 0, noshow: 0, upcoming: 0, deposits: 0 });
      if (r.status === 'done') { p.done++; p.services += r.services.price_cents; }
      if (r.status === 'noshow') p.noshow++;
      if (r.status === 'confirmed') p.upcoming++;
      if (r.deposit_paid && r.status !== 'cancelled') p.deposits += r.deposit_cents;
    }
    const rentBy = Object.fromEntries(rent.map(r => [r.barber_id, r]));
    const ids = Object.keys(per).sort((a, b) => (names[a] || '').localeCompare(names[b] || ''));
    const isThis = earnWeek === T.weekStart(today);
    const tot = ids.reduce((t, id) => ({ done: t.done + per[id].done, services: t.services + per[id].services, deposits: t.deposits + per[id].deposits }), { done: 0, services: 0, deposits: 0 });
    return `<section class="panel">
      <div class="wkhead"><div><div class="label">Earnings</div><h2>${isThis ? 'This week' : earnWeek === T.addDays(T.weekStart(today), -7) ? 'Last week' : 'Week of ' + T.label(earnWeek, { month: 'short', day: 'numeric' })}</h2>
        <div class="hint">${T.label(earnWeek, { weekday: 'short', month: 'short', day: 'numeric' })} – ${T.label(T.addDays(earnWeek, 6), { weekday: 'short', month: 'short', day: 'numeric' })}</div></div>
        <div class="mini" style="margin:0"><button data-earn="-7">← Earlier</button>${isThis ? '' : '<button data-earn="7">Later →</button>'}</div></div>
      ${owner() ? `<div class="stats"><div class="stat"><div class="n">${tot.done}</div><div class="k">cuts done</div></div>
        <div class="stat"><div class="n">${money(tot.services)}</div><div class="k">in services</div></div>
        <div class="stat"><div class="n">${money(tot.deposits)}</div><div class="k">deposits to shop</div></div></div>` : ''}
      <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Barber</th><th>Cuts done</th><th>Services</th><th>No-shows</th><th>Deposits</th><th>Rent</th></tr></thead><tbody>
      ${ids.map(id => { const p = per[id], r = rentBy[id];
        return `<tr><td><b>${esc(names[id] || 'Barber')}</b>${p.upcoming ? `<br><span class="hint">${p.upcoming} still booked</span>` : ''}</td>
          <td class="price">${p.done}</td><td class="price">${money(p.services)}</td><td class="price">${p.noshow}</td><td class="price">${money(p.deposits)}</td>
          <td>${r ? `<span class="${r.balance_cents >= 0 ? 'chip ok' : 'chip warn'}">${r.balance_cents > 0 ? 'Shop owes ' + money(r.balance_cents) : r.balance_cents < 0 ? 'Owes ' + money(-r.balance_cents) : 'Even'}</span>` : '<span class="hint">Owner</span>'}</td></tr>`; }).join('')}
      </tbody></table></div>
      <p class="hint" style="margin:0">Services use menu prices for appointments marked Done. Tips, cash extras and cuts not entered in the app aren’t included.</p>
      <div class="row"><button class="btn ghost" data-csv="week">Download this week (spreadsheet)</button><button class="btn ghost" data-csv="year">Download ${today.slice(0, 4)} so far</button></div>
      <p class="hint" style="margin:0">Spreadsheets open in Excel or Google Sheets and import into QuickBooks Online.</p>
    </section>`;
  }
  async function downloadCsv(kind) {
    const today = T.todayIn(shop.timezone);
    const from = kind === 'year' ? today.slice(0, 4) + '-01-01' : earnWeek;
    const to = kind === 'year' ? T.addDays(today, 1) : T.addDays(earnWeek, 7);
    const [rows, names] = await Promise.all([fetchBookings(from, to), teamNames()]);
    const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const fmtD = iso => new Intl.DateTimeFormat('en-CA', { timeZone: shop.timezone }).format(new Date(iso));
    const fmtT = iso => new Date(iso).toLocaleTimeString('en-US', { timeZone: shop.timezone, hour: 'numeric', minute: '2-digit' });
    const lines = [['Date', 'Time', 'Barber', 'Client', 'Service', 'Price', 'Status', 'Booked through', 'Deposit paid to shop'].join(',')];
    for (const r of rows) lines.push([fmtD(r.starts_at), fmtT(r.starts_at), names[r.barber_id] || '', r.client_name, r.services.name,
      (r.services.price_cents / 100).toFixed(2), STATUS[r.status], SRC[r.source] || r.source,
      r.deposit_paid && r.status !== 'cancelled' ? (r.deposit_cents / 100).toFixed(2) : '0.00'].map(q).join(','));
    const blob = new Blob([lines.join('\r\n') + '\r\n'], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `fades4change-${owner() ? 'shop' : me.name.split(' ')[0].toLowerCase()}-${kind === 'year' ? today.slice(0, 4) : earnWeek}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  async function saveProfile() {
    const phone = document.getElementById('p-phone').value.trim(), carrier = document.getElementById('p-carrier').value || null;
    const specialty = document.getElementById('p-spec').value.trim() || null;
    err = ''; msg = '';
    if (phone && phone.replace(/\D/g, '').length < 10) { err = 'Enter a 10-digit mobile number.'; return render(); }
    const notify_method = carrier && EMAIL_TEXT_OK.includes(carrier) ? 'email_sms' : 'push';
    const { error } = await sb.from('barbers').update({ phone: phone || null, carrier, specialty, notify_method }).eq('id', me.id);
    if (error) err = 'Couldn’t save. Try again.'; else msg = 'Saved.';
    render();
  }

  const WEBHOOK_URL = `${C.supabaseUrl}/functions/v1/clover-webhook`;
  async function paymentsPanel() {
    const { data } = await sb.rpc('payment_status', { p_shop: C.shopId });
    const p = (data && data[0]) || { environment: 'sandbox', merchant_id_hint: null, has_token: false, has_webhook_secret: false, enabled: false };
    const saved = v => v ? '<span class="chip ok">Saved</span>' : '<span class="chip warn">Not saved yet</span>';
    return `<section class="panel">
      <div class="wkhead"><div><div class="label">Owner only</div><h2>Payments (Clover)</h2>
        <p class="hint" style="margin:4px 0 0">Online $${shop.deposit_cents / 100} deposits go to your Clover account. Keys are saved securely and can’t be viewed again, only replaced.</p></div>
        <span class="chip ${p.enabled ? 'ok' : 'info'}">${p.enabled ? 'On' + (p.environment === 'sandbox' ? ' (test mode)' : '') : 'Off'}</span></div>
      <form id="payform" class="list" novalidate>
        <div class="field"><label for="pay-env">Mode</label><select id="pay-env">
          <option value="sandbox" ${p.environment === 'sandbox' ? 'selected' : ''}>Test mode (Clover sandbox, no real money)</option>
          <option value="production" ${p.environment === 'production' ? 'selected' : ''}>Live (real payments)</option></select></div>
        <div class="field"><label for="pay-mid">Merchant ID ${p.merchant_id_hint ? '<span class="hint">(saved: ' + esc(p.merchant_id_hint) + ')</span>' : ''}</label><input id="pay-mid" autocomplete="off" placeholder="${p.merchant_id_hint ? 'Leave blank to keep' : 'From Clover: Ecommerce API Tokens page'}"></div>
        <div class="field"><label for="pay-token">Private token ${saved(p.has_token)}</label><input id="pay-token" type="password" autocomplete="off" placeholder="${p.has_token ? 'Leave blank to keep' : 'Hosted checkout private token'}"></div>
        <div class="field"><label>Webhook URL (paste this into Clover)</label><div class="row" style="flex-wrap:nowrap"><input id="pay-hook" readonly value="${esc(WEBHOOK_URL)}" style="flex:1;min-width:0"><button class="btn ghost" type="button" data-copyhook>Copy</button></div>
          <span class="hint">Clover: Settings → View all settings → Ecommerce → Hosted Checkout → Webhook URL, then Generate.</span></div>
        <div class="field"><label for="pay-secret">Webhook signing secret ${saved(p.has_webhook_secret)}</label><input id="pay-secret" type="password" autocomplete="off" placeholder="${p.has_webhook_secret ? 'Leave blank to keep' : 'Shown in Clover after you click Generate'}"></div>
        <label style="display:flex;gap:10px;align-items:center;font-weight:600"><input id="pay-on" type="checkbox" ${p.enabled ? 'checked' : ''}> Take deposits online</label>
        <div class="error" role="alert">${esc(payErr)}</div><div class="ok-msg" role="status">${esc(payMsg)}</div>
        <button class="btn primary" type="submit">Save payment settings</button>
      </form>
    </section>`;
  }
  let payErr = '', payMsg = '';

  async function team() {
    const { data, error } = await sb.from('barbers').select('*').order('role', { ascending: false }).order('name');
    if (error) return '<section class="panel"><div class="error">Couldn’t load the team.</div></section>';
    return (await paymentsPanel()) + `<section class="panel">
      <div><div class="label">Owner only</div><h2>Team</h2><p class="hint" style="margin:4px 0 0">Add each barber’s email here. When they create an account with that email, it links to their chair automatically.</p></div>
      <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Barber</th><th>Login email</th><th>Phone / carrier</th></tr></thead><tbody>
      ${data.map(b => `<tr><td><b>${esc(b.name)}</b><br><span class="hint">${b.role === 'owner' ? 'Owner' : 'Barber'} · ${b.user_id ? 'Logged in' : 'Not set up yet'}</span></td>
        <td><div class="row" style="flex-wrap:nowrap"><input id="em-${b.id}" type="email" value="${esc(b.email)}" placeholder="barber@email.com" style="min-width:180px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)"><span class="mini" style="margin:0"><button data-saveemail="${b.id}">Save</button></span></div></td>
        <td>${b.phone ? esc(b.phone) : '<span class="hint">—</span>'}<br><span class="hint">${b.carrier ? CARRIERS[b.carrier] : 'No carrier yet'}</span></td></tr>`).join('')}
      </tbody></table></div>
      <div class="error" role="alert">${esc(err)}</div><div class="ok-msg" role="status">${esc(msg)}</div>
    </section>
    <section class="panel">
      <div><div class="label">Front door</div><h2>Walk-in tablet</h2>
        <p class="hint" style="margin:4px 0 0">Set up a tablet by the door so walk-ins can see who’s open and check themselves in. They pick a time and give their name, with no deposit. Check-ins only work on devices you set up here.</p></div>
      <div class="row"><button class="btn primary" data-kiosk="here">Make this device the walk-in tablet</button></div>
      <p class="hint" style="margin:0">Setting up a different tablet? Log in there as owner and tap the button on it, or open the setup link on it:</p>
      <div class="row"><button class="btn ghost" data-kiosk="link">Show setup link</button><button class="btn ghost" data-kiosk="reset">Turn off all tablets</button></div>
      ${kioskLink ? `<div class="field"><label for="kiosk-link">Setup link (keep private)</label><input id="kiosk-link" readonly value="${esc(kioskLink)}"></div>` : ''}
    </section>`;
  }
  let kioskLink = '';

  // ── Actions ───────────────────────────────────────────────────────────
  view.addEventListener('click', async e => {
    const t = e.target.closest('button'); if (!t || (t.type === 'submit' && t.form)) return; const d = t.dataset;
    if (d.auth) { authMode = d.auth; err = ''; msg = ''; return renderAuth(); }
    if ('forgot' in d) {
      const email = document.getElementById('a-email').value.trim();
      if (!/^\S+@\S+\.\S+$/.test(email)) { err = 'Type your email above first.'; return renderAuth(); }
      await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split('#')[0] });
      err = ''; msg = 'If that email is on the team, a reset link is on its way.'; return renderAuth();
    }
    err = ''; msg = '';
    if ('addopen' in d) { adding = true; addErr = ''; }
    else if ('addclose' in d) { adding = false; addErr = ''; }
    else if (d.tab) { tab = d.tab; adding = false; }
    else if (d.day) day = d.day;
    else if (d.earn) earnWeek = T.addDays(earnWeek, +d.earn);
    else if (d.csv) {
      t.disabled = true;
      try { await downloadCsv(d.csv); } catch (_) { err = 'Couldn’t build the spreadsheet. Try again.'; }
      t.disabled = false;
      if (!err) return;
    }
    else if (d.status) { const { error } = await sb.from('bookings').update({ status: d.status }).eq('id', d.id); if (error) err = 'Couldn’t update that booking.'; }
    else if (d.deposit) { const { error } = await sb.rpc('mark_deposit_paid', { p_booking: d.id, p_paid: d.deposit === 'yes' }); if (error) err = 'Couldn’t update the deposit.'; }
    else if (d.settle) { const { error } = await sb.rpc('mark_rent_settled', { p_barber: d.settle, p_week_start: d.week }); if (error) err = 'Couldn’t mark that week.'; }
    else if (d.ack) { const { error } = await sb.rpc('confirm_rent_settled', { p_week_start: d.ack }); if (error) err = 'Couldn’t confirm.'; }
    else if ('saverent' in d) {
      const v = Math.round(parseFloat(document.getElementById('rent-amt').value) * 100);
      if (!(v >= 0)) err = 'Enter a rent amount.';
      else { const { data, error } = await sb.from('shops').update({ weekly_rent_cents: v }).eq('id', shop.id).select().single(); if (error) err = 'Couldn’t save rent.'; else { shop = data; msg = 'Rent saved.'; } }
    }
    else if (d.kiosk) {
      const { data: tok, error } = await sb.rpc('get_kiosk_token', { p_shop: C.shopId, p_reset: d.kiosk === 'reset' });
      if (error) err = 'Couldn’t set up the tablet. Try again.';
      else if (d.kiosk === 'here') { location.href = 'walkin.html?kiosk=' + encodeURIComponent(tok); return; }
      else if (d.kiosk === 'link') kioskLink = new URL('walkin.html?kiosk=' + encodeURIComponent(tok), location.href).href;
      else { kioskLink = ''; msg = 'All walk-in tablets are turned off. Set up the tablet again to turn it back on.'; }
    }
    else if ('copyhook' in d) {
      const inp = document.getElementById('pay-hook');
      try { await navigator.clipboard.writeText(inp.value); t.textContent = 'Copied'; } catch (_) { inp.focus(); inp.select(); }
      return;
    }
    else if ('copycal' in d) {
      const inp = document.getElementById('cal-link');
      try { await navigator.clipboard.writeText(inp.value); t.textContent = 'Copied'; } catch (_) { inp.focus(); inp.select(); }
      return;
    }
    else if ('testtext' in d) {
      t.disabled = true; t.textContent = 'Sending…';
      const { data, error } = await sb.functions.invoke('reminders', { body: { test: true } });
      if (error || !data || !data.sent) err = 'The test text didn’t send. Check your number and carrier, or try again in a minute.';
      else msg = 'Test text sent. It can take a minute to arrive.';
    }
    else if (d.saveemail) {
      const v = document.getElementById('em-' + d.saveemail).value.trim().toLowerCase();
      if (v && !/^\S+@\S+\.\S+$/.test(v)) err = 'That email doesn’t look right.';
      else { const { error } = await sb.from('barbers').update({ email: v || null }).eq('id', d.saveemail); err = error ? (/duplicate|unique/i.test(error.message) ? 'Another barber already has that email.' : 'Couldn’t save the email.') : ''; if (!error) msg = 'Email saved.'; }
    }
    else return;
    render();
  });

  document.getElementById('signout').onclick = async () => { await sb.auth.signOut(); me = null; tab = 'schedule'; authMode = 'signin'; renderAuth(); };
  sb.auth.onAuthStateChange((event) => { if (event === 'SIGNED_IN' && !me) start(); });
  start();
})();
</script>
</body>
</html>
